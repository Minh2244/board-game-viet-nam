<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">

  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#090D16" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="cashG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="silverG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="55%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="redG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="skyBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="warmDawn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="emeraldBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="violetBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="stormBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="crimsonBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450A0A"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <rect width="360" height="220" rx="22" fill="url(#skyBlue)"/>
  <circle cx="290" cy="46" r="90" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="64" cy="182" r="78" fill="#FFFFFF" opacity="0.06"/>
  
  <g fill="#FEF08A" opacity="0.9">
    <path d="M46 38 L49 46 L57 49 L49 52 L46 60 L43 52 L35 49 L43 46 Z"/>
    <path d="M308 32 L310 38 L316 40 L310 42 L308 48 L306 42 L300 40 L306 38 Z"/>
    <circle cx="295" cy="175" r="3.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="58" cy="172" r="4" fill="#FDE047" opacity="0.7"/>
  </g>

  
      <!-- Gọi Vốn Shark Tank: Cá mập doanh nhân + vali tiền -->
      <ellipse cx="180" cy="186" rx="110" ry="14" fill="#090D16" opacity="0.35"/>
      <!-- Cá mập vui tính mặc vest -->
      <g transform="translate(128,116)" filter="url(#sh)">
        <path d="M-36 58 Q-44 0 -10 -44 Q12 -68 22 -38 Q42 0 42 58 Z" fill="#38BDF8" stroke="#0C4A6E" stroke-width="3"/>
        <path d="M-12 58 Q-10 8 8 -14 Q26 8 28 58 Z" fill="#F8FAFC"/>
        <!-- Cà vạt đỏ & mắt -->
        <polygon points="8,-6 14,12 8,36 2,12" fill="#EF4444"/>
        <circle cx="-6" cy="-24" r="5" fill="#0F172A"/>
        <circle cx="-4.5" cy="-25.5" r="1.5" fill="#FFF"/>
        <path d="M-16 0 Q6 14 24 0" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
      </g>
      <!-- Vali tiền mở sáng rực -->
      <g transform="translate(242,134)" filter="url(#sh)">
        <rect x="-48" y="-6" width="96" height="54" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
        <rect x="-42" y="-36" width="84" height="30" rx="6" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
        
  <g transform="translate(0,-10) rotate(-8)" filter="url(#sh)">
    <rect x="-42" y="-20" width="84" height="40" rx="6" fill="url(#cashG)" stroke="#ECFDF5" stroke-width="2"/>
    <rect x="-35" y="-14" width="70" height="28" rx="3" fill="none" stroke="#A7F3D0" stroke-width="1.4" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="10" fill="#ECFDF5" opacity="0.88"/>
    <path d="M-3 -5 V5 M3 -5 V5 M-5 -1 H5" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
  </g>

        
  <g transform="translate(14,-4) rotate(10)" filter="url(#sh)">
    <rect x="-42" y="-20" width="84" height="40" rx="6" fill="url(#cashG)" stroke="#ECFDF5" stroke-width="2"/>
    <rect x="-35" y="-14" width="70" height="28" rx="3" fill="none" stroke="#A7F3D0" stroke-width="1.4" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="10" fill="#ECFDF5" opacity="0.88"/>
    <path d="M-3 -5 V5 M3 -5 V5 M-5 -1 H5" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
  </g>

      </g>
    
</svg>
