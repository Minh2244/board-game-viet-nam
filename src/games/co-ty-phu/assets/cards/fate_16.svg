<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#090D16" flood-opacity="0.38"/>
    </filter>
    <linearGradient id="crimsonBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7F1D1D"/>
      <stop offset="55%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="envRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>

  <rect width="360" height="220" rx="22" fill="url(#crimsonBg)"/>
  <circle cx="290" cy="46" r="90" fill="#FEF08A" opacity="0.1"/>
  <circle cx="64" cy="182" r="78" fill="#FEF08A" opacity="0.08"/>

  <!-- Hoa mai vàng 5 cánh hai góc -->
  <g transform="translate(76,68)" fill="#FDE047" filter="url(#sh)">
    <circle cx="0" cy="-14" r="9"/>
    <circle cx="13" cy="-4" r="9"/>
    <circle cx="8" cy="11" r="9"/>
    <circle cx="-8" cy="11" r="9"/>
    <circle cx="-13" cy="-4" r="9"/>
    <circle cx="0" cy="0" r="6" fill="#EA580C"/>
  </g>
  <g transform="translate(284,64) scale(0.85)" fill="#FEF08A" filter="url(#sh)">
    <circle cx="0" cy="-14" r="9"/>
    <circle cx="13" cy="-4" r="9"/>
    <circle cx="8" cy="11" r="9"/>
    <circle cx="-8" cy="11" r="9"/>
    <circle cx="-13" cy="-4" r="9"/>
    <circle cx="0" cy="0" r="6" fill="#EA580C"/>
  </g>

  <!-- Lộc Khai Xuân Đầu Năm: Phong bao lì xì đỏ viền vàng + đồng xu lộc -->
  <ellipse cx="180" cy="186" rx="108" ry="12" fill="#000" opacity="0.28"/>
  <g transform="translate(180,114)" filter="url(#sh)">
    <rect x="-58" y="-70" width="116" height="140" rx="14" fill="url(#envRed)" stroke="#FDE047" stroke-width="4"/>
    <path d="M-58 -40 Q0 -4 58 -40" fill="none" stroke="#FDE047" stroke-width="3.5"/>
    <circle cx="0" cy="-12" r="24" fill="url(#goldG)" stroke="#FEF9C3" stroke-width="3"/>
    <rect x="-8" y="-20" width="16" height="16" rx="2" fill="#991B1B"/>
    <!-- Tiền vàng ló ra từ nắp bao lì xì -->
    <circle cx="-74" cy="42" r="18" fill="url(#goldG)" stroke="#FEF08A" stroke-width="3"/>
    <rect x="-80" y="36" width="12" height="12" rx="1.5" fill="#991B1B"/>
    <circle cx="76" cy="40" r="20" fill="url(#goldG)" stroke="#FEF08A" stroke-width="3"/>
    <rect x="69" y="33" width="14" height="14" rx="1.5" fill="#991B1B"/>
  </g>
</svg>
