  <rect width="360" height="220" rx="22" fill="url(#warmDawn)"/>
  <circle cx="290" cy="46" r="90" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="64" cy="182" r="78" fill="#FFFFFF" opacity="0.06"/>
  
  <g fill="#FEF08A" opacity="0.9">
    <path d="M46 38 L49 46 L57 49 L49 52 L46 60 L43 52 L35 49 L43 46 Z"/>
    <path d="M308 32 L310 38 L316 40 L310 42 L308 48 L306 42 L300 40 L306 38 Z"/>
    <circle cx="295" cy="175" r="3.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="58" cy="172" r="4" fill="#FDE047" opacity="0.7"/>
  </g>

  
      <!-- Nhặt Được Của Rơi -->
      <g transform="translate(175,122) rotate(-8)" filter="url(#sh)">
        <rect x="-66" y="-42" width="132" height="84" rx="14" fill="#78350F" stroke="#FDE68A" stroke-width="3"/>
        <rect x="-60" y="-36" width="120" height="72" rx="10" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="5 3"/>
        <rect x="24" y="-14" width="48" height="28" rx="8" fill="#92400E" stroke="#FDE68A" stroke-width="2"/>
        <circle cx="42" cy="0" r="6" fill="#FDE047"/>
      </g>
      
  <g transform="translate(142,68) rotate(-16)" filter="url(#sh)">
    <rect x="-42" y="-20" width="84" height="40" rx="6" fill="url(#cashG)" stroke="#ECFDF5" stroke-width="2"/>
    <rect x="-35" y="-14" width="70" height="28" rx="3" fill="none" stroke="#A7F3D0" stroke-width="1.4" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="10" fill="#ECFDF5" opacity="0.88"/>
    <path d="M-3 -5 V5 M3 -5 V5 M-5 -1 H5" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
  </g>

      
  <g transform="translate(186,62) rotate(12)" filter="url(#sh)">
    <rect x="-42" y="-20" width="84" height="40" rx="6" fill="url(#cashG)" stroke="#ECFDF5" stroke-width="2"/>
    <rect x="-35" y="-14" width="70" height="28" rx="3" fill="none" stroke="#A7F3D0" stroke-width="1.4" stroke-dasharray="4 2"/>
    <circle cx="0" cy="0" r="10" fill="#ECFDF5" opacity="0.88"/>
    <path d="M-3 -5 V5 M3 -5 V5 M-5 -1 H5" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
  </g>

      <!-- Huy chương thưởng -->
      <g transform="translate(274,142)" filter="url(#sh)">
        <polygon points="-14,16 0,-6 14,16" fill="#EF4444"/>
        <circle cx="0" cy="-16" r="22" fill="url(#goldG)" stroke="#FFF" stroke-width="2.5"/>
        <polygon points="0,-28 4,-19 14,-18 6,-12 8,-2 0,-7 -8,-2 -6,-12 -14,-18 -4,-19" fill="#FFF"/>
      </g>
    
</svg>
